# ═══════════════════════════════════════════════════════════════════════
# V2.B REV 2 streamed-rate topologies (2026-04-20)
# Fashion-MNIST 14×14 (196 dim), 256×256 CIM array, true BSRC streamed rate
# ═══════════════════════════════════════════════════════════════════════

- name: '196_10'
  role: v2_demo
  dataset: fashion_mnist
  input_encoding: streamed_rate
  stream_timesteps: 64
  adc_bits: 10
  adc_full_scale: active_wl
  num_fc_stages: 1
  input_dim: 196
  stages:
  - in_dim: 196
    out_dim: 10
    timesteps: 1              # NOT used under streamed_rate (stream_timesteps dominates)
    use_bitplane: false       # streamed_rate requires use_bitplane=false everywhere
    threshold: 16             # TBD via firing-rate calibration (placeholder)
    sum_max: 2940             # 196 × 15 (active_wl)
    weight_pos_hex: results_multilayer/196_10/weights/L0_pos.hex
    weight_neg_hex: results_multilayer/196_10/weights/L0_neg.hex

- name: '196_64_10'
  role: v2_demo
  dataset: fashion_mnist
  input_encoding: streamed_rate
  stream_timesteps: 64
  adc_bits: 10
  adc_full_scale: active_wl
  num_fc_stages: 2
  input_dim: 196
  stages:
  - in_dim: 196
    out_dim: 64
    timesteps: 1
    use_bitplane: false
    threshold: 16
    sum_max: 2940             # 196 × 15
    weight_pos_hex: results_multilayer/196_64_10/weights/L0_pos.hex
    weight_neg_hex: results_multilayer/196_64_10/weights/L0_neg.hex
  - in_dim: 64
    out_dim: 10
    timesteps: 1
    use_bitplane: false
    threshold: 8
    sum_max: 960              # 64 × 15
    weight_pos_hex: results_multilayer/196_64_10/weights/L1_pos.hex
    weight_neg_hex: results_multilayer/196_64_10/weights/L1_neg.hex

