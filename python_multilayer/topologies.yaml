schema_version: '1.0'
global:
  scheme: B
  adc_bits: 8
  weight_bits: 4
  reset_mode: soft
  preprocess: avgpool_8x8
v1_baseline:
  python_dir: ../项目相关文件/器件对齐/Python建模
  weight_pos_hex: results/exports/weight_pos.hex
  weight_neg_hex: results/exports/weight_neg.hex
  alignment_manifest: results/exports/rtl_stimulus_batch100/alignment_manifest.json
  reported_full_test_accuracy: 0.8776
  alignment_subset_accuracy: null
  frozen_rtl_threshold: 2550
topologies:
- name: 64to10_baseline
  role: v1_frozen_baseline
  num_fc_stages: 1
  input_dim: 64
  stages:
  - in_dim: 64
    out_dim: 10
    timesteps: 10
    use_bitplane: true
    threshold: 2550
    weight_pos_hex: results_multilayer/64to10_baseline/weights/L0_pos.hex
    weight_neg_hex: results_multilayer/64to10_baseline/weights/L0_neg.hex
- name: '64_10'
