# ═══════════════════════════════════════════════════════════════════════
# V2.B CONV Extension M1 placeholders.
# Kept under a separate root key so the existing FC-only TopologyFile loader
# remains backward-compatible until M3/M4 schema consumers are updated.
# stage_type is frozen as: fc | conv | flatten.
# ═══════════════════════════════════════════════════════════════════════

conv_synthetic_topologies:
- name: lenet5_synthetic
  role: v2_demo
  dataset: mnist
  input_encoding: streamed_rate
  stream_timesteps: 10
  stages:
  - stage_type: conv
    K: 5
    stride: 1
    pad: 2
    H: 28
    W: 28
    C_in: 1
    C_out: 6
    T: 10
  - stage_type: conv
    K: 5
    stride: 2
    pad: 0
    H: 28
    W: 28
    C_in: 6
    C_out: 16
    T: 10
  - stage_type: flatten
    H: 12
    W: 12
    C_in: 16
    C_out: 120
    T: 10
  - stage_type: fc
    in_dim: 120
    out_dim: 84
    T: 10
  - stage_type: fc
    in_dim: 84
    out_dim: 10
    T: 10
- name: synthetic_conv_C1
  stages: [{stage_type: conv, K: 3, stride: 1, pad: 1, C_in: 4, C_out: 8, H: 8, W: 8, T: 10}]
- name: synthetic_conv_C2
