- name: synthetic_conv_C4
  stages: [{stage_type: conv, K: 3, stride: 1, pad: 1, C_in: 32, C_out: 32, H: 8, W: 8, T: 64}]
- name: synthetic_conv_C5
  stages: [{stage_type: conv, K: 3, stride: 1, pad: 1, C_in: 64, C_out: 64, H: 8, W: 8, T: 64}]
- name: synthetic_conv_C6
